name: tween_mini_app_store
description: A reusable mini app marketplace and WebView runtime for Flutter applications.
version: 0.1.0
publish_to: 'none'
environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'
dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.10.0
  url_launcher: ^6.3.1
  http: ^1.2.2
  html: ^0.15.4
  file_picker: ^10.3.10
  archive: ^4.0.2
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
